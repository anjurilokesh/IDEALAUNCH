<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>IDEALAUNCH - Explore</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        IDEA<span>LAUNCH</span>
    </div>

    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="explore.html">Explore</a>
        <a href="saved.html">Saved</a>
        <a href="profile.html">Profile</a>
        <button class="logout">Logout</button>
    </div>

</nav>

<main class="container">

    <div class="hero">

        <h1>Explore <span>Ideas</span></h1>

        <p>
            Find startup ideas based on your interests.
        </p>

    </div>

    <div class="controls">

        <input
            type="text"
            id="searchInput"
            placeholder="Search startup ideas...">

        <select id="categoryFilter">

            <option value="all">
                All Categories
            </option>

            <option value="Agriculture">
                Agriculture
            </option>

            <option value="Education">
                Education
            </option>

            <option value="Health">
                Health
            </option>

            <option value="Environment">
                Environment
            </option>

            <option value="Technology">
                Technology
            </option>

            <option value="Business">
                Business
            </option>

        </select>

    </div>

    <div
        id="ideasContainer"
        class="ideas-grid">
    </div>

</main>

<script src="data.js"></script>
<script src="script.js"></script>

</body>
</html>
